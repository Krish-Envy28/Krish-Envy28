<svg viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neural map: AI, embedded systems, software, prototypes — all from one pipeline">
  <style>
    :root {
      --bone: #000000; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0;
      --node-bg: #F0F0F0; --core-bg: #E8E8E8; --accent: #555555;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node { fill: none; stroke: var(--rule); stroke-width: 1; }
    .wire { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.2s}.w2{animation-delay:.35s}.w3{animation-delay:.5s}.w4{animation-delay:.65s}.w5{animation-delay:.8s}.w6{animation-delay:.95s}
    .flow { stroke: var(--muted); stroke-width: 1; opacity: .2; stroke-dasharray: 3 9; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:.9s}.p2{animation-delay:1.0s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}.p5{animation-delay:1.3s}.p6{animation-delay:1.4s}
    .core { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.55} }
    @media (prefers-reduced-motion: reduce) {
      .wire,.flow,.pop,.core { animation: none; }
      .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.1}
    }
  </style>

  <defs>
    <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="520">
      <rect x="0" y="0" width="1000" height="520" fill="white"/>
      <rect x="405" y="192" width="190" height="56" fill="black"/>
      <rect x="85" y="108" width="210" height="54" fill="black"/>
      <rect x="65" y="258" width="210" height="54" fill="black"/>
      <rect x="340" y="56" width="210" height="54" fill="black"/>
      <rect x="575" y="56" width="210" height="54" fill="black"/>
      <rect x="730" y="128" width="210" height="54" fill="black"/>
      <rect x="730" y="278" width="210" height="54" fill="black"/>
      <rect x="250" y="368" width="210" height="54" fill="black"/>
      <rect x="550" y="368" width="210" height="54" fill="black"/>
    </mask>
  </defs>

  <line x1="48" y1="30" x2="952" y2="30" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="18" font-size="11" letter-spacing="3.5">NEURAL MAP — EVERYTHING FROM ONE BRAIN</text>
  <text fill="var(--muted)" class="mono" x="952" y="18" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <!-- wires -->
  <g mask="url(#cuts)">
    <line class="wire w1" x1="405" y1="220" x2="295" y2="135"/>
    <line class="wire w2" x1="405" y1="220" x2="275" y2="285"/>
    <line class="wire w3" x1="460" y1="192" x2="445" y2="110"/>
    <line class="wire w4" x1="530" y1="192" x2="680" y2="83"/>
    <line class="wire w5" x1="595" y1="200" x2="730" y2="155"/>
    <line class="wire w6" x1="595" y1="230" x2="730" y2="305"/>
    <line class="wire w1" x1="460" y1="248" x2="355" y2="368"/>
    <line class="wire w2" x1="540" y1="248" x2="655" y2="368"/>
  </g>
  <g mask="url(#cuts)">
    <line class="flow" x1="405" y1="220" x2="295" y2="135"/>
    <line class="flow" x1="405" y1="220" x2="275" y2="285"/>
    <line class="flow" x1="460" y1="192" x2="445" y2="110"/>
    <line class="flow" x1="530" y1="192" x2="680" y2="83"/>
    <line class="flow" x1="595" y1="200" x2="730" y2="155"/>
    <line class="flow" x1="595" y1="230" x2="730" y2="305"/>
    <line class="flow" x1="460" y1="248" x2="355" y2="368"/>
    <line class="flow" x1="540" y1="248" x2="655" y2="368"/>
  </g>

  <!-- cluster labels -->
  <text fill="var(--accent)" class="mono pop p6" x="190" y="90" font-size="10" letter-spacing="3" text-anchor="middle">AI / ML</text>
  <text fill="var(--accent)" class="mono pop p6" x="500" y="42" font-size="10" letter-spacing="3" text-anchor="middle">SOFTWARE</text>
  <text fill="var(--accent)" class="mono pop p6" x="835" y="108" font-size="10" letter-spacing="3" text-anchor="middle">EMBEDDED</text>
  <text fill="var(--accent)" class="mono pop p6" x="500" y="460" font-size="10" letter-spacing="3" text-anchor="middle">PROTOTYPES &amp; DATA</text>

  <!-- core -->
  <g class="pop p0">
    <rect class="node" x="405" y="192" width="190" height="56" rx="2"/>
    <text fill="var(--bone)" class="mono core" x="500" y="216" font-size="13" letter-spacing="2" text-anchor="middle">KRISH.SYS</text>
    <text fill="var(--muted)" class="mono" x="500" y="234" font-size="8.5" letter-spacing="0.5" text-anchor="middle">one-person build pipeline</text>
  </g>

  <!-- nodes -->
  <g class="pop p1"><rect class="node" x="85" y="108" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="190" y="131" font-size="12" letter-spacing="1" text-anchor="middle">gen-ai applications</text><text fill="var(--muted)" class="mono" x="190" y="150" font-size="9" letter-spacing="1" text-anchor="middle">LLMs · prompting · agents</text></g>
  <g class="pop p2"><rect class="node" x="65" y="258" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="170" y="281" font-size="12" letter-spacing="1" text-anchor="middle">voice assistants</text><text fill="var(--muted)" class="mono" x="170" y="300" font-size="9" letter-spacing="1" text-anchor="middle">NLP · speech-to-text · AI</text></g>
  <g class="pop p3"><rect class="node" x="340" y="56" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="445" y="79" font-size="12" letter-spacing="1" text-anchor="middle">web development</text><text fill="var(--muted)" class="mono" x="445" y="98" font-size="9" letter-spacing="1" text-anchor="middle">JS · HTML · CSS · Firebase</text></g>
  <g class="pop p4"><rect class="node" x="575" y="56" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="680" y="79" font-size="12" letter-spacing="1" text-anchor="middle">automation scripts</text><text fill="var(--muted)" class="mono" x="680" y="98" font-size="9" letter-spacing="1" text-anchor="middle">Python · data pipelines</text></g>
  <g class="pop p5"><rect class="node" x="730" y="128" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="835" y="151" font-size="12" letter-spacing="1" text-anchor="middle">raspberry pi</text><text fill="var(--muted)" class="mono" x="835" y="170" font-size="9" letter-spacing="1" text-anchor="middle">IoT · sensors · edge AI</text></g>
  <g class="pop p6"><rect class="node" x="730" y="278" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="835" y="301" font-size="12" letter-spacing="1" text-anchor="middle">robotics</text><text fill="var(--muted)" class="mono" x="835" y="320" font-size="9" letter-spacing="1" text-anchor="middle">actuators · control · CV</text></g>
  <g class="pop p1"><rect class="node" x="250" y="368" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="355" y="391" font-size="12" letter-spacing="1" text-anchor="middle">ML models</text><text fill="var(--muted)" class="mono" x="355" y="410" font-size="9" letter-spacing="1" text-anchor="middle">TensorFlow · PyTorch · sklearn</text></g>
  <g class="pop p2"><rect class="node" x="550" y="368" width="210" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="655" y="391" font-size="12" letter-spacing="1" text-anchor="middle">data solutions</text><text fill="var(--muted)" class="mono" x="655" y="410" font-size="9" letter-spacing="1" text-anchor="middle">NumPy · analytics · viz</text></g>

  <line x1="48" y1="490" x2="952" y2="490" stroke="var(--rule)"/>
  <text fill="var(--dim)" class="mono" x="952" y="510" font-size="10" letter-spacing="2" text-anchor="end">DASHED LINES — DATA IN MOTION</text>
</svg>
