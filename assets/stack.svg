<svg viewBox="0 0 1000 238" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, ai/ml, embedded, web, tooling">
  <style>
    :root { --bone: #000000; --rule: #C0C0C0; --muted: #888888; --accent: #555555; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="138" y1="8" x2="138" y2="230" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <text class="mono rise a1" x="48" y="32"  font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="154" y="32"  font-size="15" fill="var(--bone)">Python · C++ · JavaScript · HTML5 · CSS3</text>

  <text class="mono rise a2" x="48" y="72"  font-size="12" fill="var(--muted)" letter-spacing="2">AI / ML</text>
  <text class="mono rise a2" x="154" y="72"  font-size="15" fill="var(--bone)">TensorFlow · PyTorch · scikit-learn · NumPy · Anaconda</text>

  <text class="mono rise a3" x="48" y="112" font-size="12" fill="var(--muted)" letter-spacing="2">EMBEDDED</text>
  <text class="mono rise a3" x="154" y="112" font-size="15" fill="var(--bone)">Raspberry Pi · Arduino · Embedded C · IoT Sensors</text>

  <text class="mono rise a4" x="48" y="152" font-size="12" fill="var(--muted)" letter-spacing="2">WEB</text>
  <text class="mono rise a4" x="154" y="152" font-size="15" fill="var(--bone)">HTML5 · CSS3 · JavaScript · Firebase · Vercel</text>

  <text class="mono rise a5" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">DATA</text>
  <text class="mono rise a5" x="154" y="192" font-size="15" fill="var(--bone)">NumPy · Pandas · Matplotlib · Jupyter · Data Pipelines</text>

  <text class="mono rise a6" x="48" y="224" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a6" x="154" y="224" font-size="15" fill="var(--bone)">Git · VS Code · Jupyter · Anaconda · Figma</text>
</svg>
