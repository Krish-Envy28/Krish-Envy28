  <style>
    :root { --bone: #000000; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0; --accent: #555555; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .reveal { opacity: 0; animation: reveal .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .d1{animation-delay:.1s} .d2{animation-delay:.2s} .d3{animation-delay:.3s} .d4{animation-delay:.4s}
    .d5{animation-delay:.5s} .d6{animation-delay:.6s} .d7{animation-delay:.7s} .d8{animation-delay:.8s}
    .d9{animation-delay:.9s} .d10{animation-delay:1.0s} .d11{animation-delay:1.1s} .d12{animation-delay:1.2s}
    .d13{animation-delay:1.3s} .d14{animation-delay:1.4s} .d15{animation-delay:1.5s} .d16{animation-delay:1.6s}
    .d17{animation-delay:1.7s} .d18{animation-delay:1.8s} .d19{animation-delay:1.9s} .d20{animation-delay:2.0s}
    .blink { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .scan { animation: scan 3s ease-in-out infinite; }
    @keyframes scan { 0%,100%{opacity:.05} 50%{opacity:.15} }
    @media (prefers-reduced-motion: reduce) {
      .reveal,.blink,.scan { animation: none; } .reveal{opacity:1} .scan{opacity:.08}
    }
  </style>

