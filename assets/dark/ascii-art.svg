<svg viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ASCII art — Creation of Adam hands with PROJECT.EXE window">
  <style>
    :root { --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444; --accent: #AAAAAA; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .reveal { opacity: 0; animation: reveal .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .d1{animation-delay:.1s} .d2{animation-delay:.2s} .d3{animation-delay:.3s} .d4{animation-delay:.4s}
    .d5{animation-delay:.5s} .d6{animation-delay:.6s} .d7{animation-delay:.7s} .d8{animation-delay:.8s}
    .d9{animation-delay:.9s} .d10{animation-delay:1.0s} .d11{animation-delay:1.1s} .d12{animation-delay:1.2s}
    .d13{animation-delay:1.3s} .d14{animation-delay:1.4s} .d15{animation-delay:1.5s} .d16{animation-delay:1.6s}
    .d17{animation-delay:1.7s} .d18{animation-delay:1.8s} .d19{animation-delay:1.9s} .d20{animation-delay:2.0s}
    .blink { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .scan { animation: scan 3s ease-in-out infinite; }
    @keyframes scan { 0%,100%{opacity:.05} 50%{opacity:.15} }
    @media (prefers-reduced-motion: reduce) {
      .reveal,.blink,.scan { animation: none; } .reveal{opacity:1} .scan{opacity:.08}
    }
  </style>

  <defs>
    <pattern id="scanlines-d" width="1000" height="4" patternUnits="userSpaceOnUse">
      <rect width="1000" height="2" fill="var(--bone)" opacity=".03"/>
    </pattern>
  </defs>

  <rect x="100" y="10" width="800" height="400" fill="none" stroke="var(--rule)" stroke-width="1" rx="2" class="reveal d1"/>
  <rect x="100" y="10" width="800" height="400" fill="url(#scanlines-d)" class="scan"/>

  <g class="mono" fill="var(--bone)" font-size="7.5" letter-spacing="0.5">
    <text x="160" y="60"  class="reveal d2">                                                                                             </text>
    <text x="160" y="72"  class="reveal d3">                                                        ┌─────────────────────┐              </text>
    <text x="160" y="84"  class="reveal d4">                                                        │ PROJECT.EXE    _□ x │              </text>
    <text x="160" y="96"  class="reveal d5">                                          ░░▒▒          ├─────────────────────┤              </text>
    <text x="160" y="108" class="reveal d6">                                      ░▒▓██▓▒░          │                     │         ░░   </text>
    <text x="160" y="120" class="reveal d7">                                  ░▒▓███████▓░          │                     │       ░▒▓▓░  </text>
    <text x="160" y="132" class="reveal d8">                              ░▒▓██████████▓░░          │     &gt; loading...    │     ░▒▓███▓░ </text>
    <text x="160" y="144" class="reveal d9">                          ░░▒▓████████████▓▒░           │     &gt; init AI_     │   ░▒▓█████▓░</text>
    <text x="160" y="156" class="reveal d10">                      ░░▒▓██████████████▓▓▒░░          │     &gt; run dream    │  ░▒▓██████▓▒</text>
    <text x="160" y="168" class="reveal d11">                  ░░▒▓████████▓▓▓█████▓▓▒░░            │                     │ ░▒▓████████▓</text>
    <text x="160" y="180" class="reveal d12">               ░▒▓██████████▓▒░ ░▓████▓▒░              │                     │░▒██████████▓</text>
    <text x="160" y="192" class="reveal d13">           ░░▒▓███████████▓▒░    ░▓███▓▒░              └─────────────────────┘▒▓██████████▓</text>
    <text x="160" y="204" class="reveal d14">        ░▒▓██████████████▓▒░      ░▓██▓▒░                ░░▒▒▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓████████████▓</text>
    <text x="160" y="216" class="reveal d15">     ░▒▓████████████████▓▒░        ░▓█▓▒░           ░░▒▒▓▓████████████████████████████████▓</text>
    <text x="160" y="228" class="reveal d16">  ░░▒▓██████████████████▓▒░         ░▓▓▒░       ░░▒▓▓████████████████████████████████████▓░</text>
    <text x="160" y="240" class="reveal d17">░▒▓████████████████████▓▓▒░░         ░▒▒░   ░░▒▓▓██████████████████████████████████████▓░  </text>
    <text x="160" y="252" class="reveal d18">▓████████████████████████▓▓▒░░        ░░░░▒▓▓████████████████████████████████████████▓▒░   </text>
    <text x="160" y="264" class="reveal d19">████████████████████████████▓▓▒░░░░░░▒▓▓███████████████████████████████████████████▓▒░     </text>
    <text x="160" y="276" class="reveal d20">██████████████████████████████████▓▓▓████████████████████████████████████████████▓▒░       </text>
  </g>

  <text class="mono reveal d20" x="500" y="320" font-size="10" fill="var(--muted)" letter-spacing="3" text-anchor="middle">「 HUMAN AFTER ALL 🤷 」</text>
  <text class="mono reveal d20" x="500" y="345" font-size="9" fill="var(--dim)" letter-spacing="2" text-anchor="middle">where technology meets creation — the spark between two worlds</text>
  <text class="mono blink" x="500" y="375" font-size="12" fill="var(--accent)" text-anchor="middle">█</text>
</svg>
